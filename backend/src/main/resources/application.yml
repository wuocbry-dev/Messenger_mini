spring:
  application:
    name: messenger-mini
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Load local secrets from backend/.env (KEY=VALUE). Works whether the app is
  # started from backend/ (mvnw) or from the repo root (IDE). Real environment
  # variables still take precedence.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:messenger_mini}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
    username: ${DB_USERNAME:messenger_user}
    password: ${DB_PASSWORD:messenger_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Gmail SMTP with an App Password (Google Account > Security > App passwords).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Comma-separated list of frontend origins allowed to call /api/**.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:90}
  storage:
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:}
      presigned-ttl-seconds: ${R2_PRESIGNED_TTL_SECONDS:900}
      key-prefix: ${R2_KEY_PREFIX:messenger/}
  presence:
    # Seconds a user with no open connection stays online (absorbs page reloads).
    offline-grace-seconds: ${PRESENCE_OFFLINE_GRACE_SECONDS:5}
  mail:
    # Sender address; Gmail only accepts the account itself or a verified alias.
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:Messenger Mini}
    app-url: ${APP_PUBLIC_URL:http://localhost:5173}
  agora:
    app-id: ${AGORA_APP_ID:}
    app-certificate: ${AGORA_APP_CERTIFICATE:}
    token-ttl-seconds: ${AGORA_TOKEN_TTL_SECONDS:600}
    ring-timeout-seconds: ${AGORA_RING_TIMEOUT_SECONDS:45}
