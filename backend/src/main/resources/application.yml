spring:
  application:
    name: messenger-mini
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Load local secrets from backend/.env (KEY=VALUE). Works whether the app is
  # started from backend/ (mvnw) or from the repo root (IDE). Real environment
  # variables still take precedence.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:messenger_mini}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
    username: ${DB_USERNAME:messenger_user}
    password: ${DB_PASSWORD:messenger_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# Public server URL exposed in Swagger UI's "Servers" dropdown.
# Override per environment if the API is behind a tunnel/proxy.
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    # Comma-separated list of frontend origins allowed to call /api/**.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  storage:
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:}
      presigned-ttl-seconds: ${R2_PRESIGNED_TTL_SECONDS:900}
      key-prefix: ${R2_KEY_PREFIX:messenger/}
  agora:
    app-id: ${AGORA_APP_ID:a43e60236da641ae8f24800666cfca43}
    app-certificate: ${AGORA_APP_CERTIFICATE:874800e72219464c9454ceb739fca8fa}
    token-ttl-seconds: ${AGORA_TOKEN_TTL_SECONDS:600}
